# Fork-friendly CI: the official ci.yml targets deepseek-ai's private runner
# pools (dsh-ubuntu-24-04-16core, self-hosted failover) that do not exist on
# this fork, so every enterprise job would queue forever. This replacement
# runs the same static gate set plus a build on a standard hosted runner.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

# Cancel a superseded run on a new push so a fresh head does not queue a
# second full run behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: node 24 / static gates + build
    runs-on: ubuntu-latest
    steps:
      # Fetch complete history so the archive gate can read the trusted base
      # from a shallow checkout.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:static

      - name: Build
        run: pnpm run build
