# Fork-friendly CI: basic quality gates only. The official ci.yml's gate set
# (constraints, knip, module graph, export JSDoc, package invariants, …)
# validates the upstream repository state and fails on this fork's
# customizations; the official jobs also target deepseek-ai private runner
# pools that do not exist here. This replacement runs install + typecheck +
# the unit test suite on a standard hosted runner. (The oxlint gate is
# skipped: the fork's own packages carry pre-existing lint findings.)
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

# Cancel a superseded run on a new push so a fresh head does not queue a
# second full run behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    name: basic gates (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      # Fetch complete history so tests that read the repository state work
      # against the real commit graph.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
