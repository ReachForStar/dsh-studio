name: Release Desktop

# Desktop installers for every supported system, attached to one GitHub Release.
#
# Triggers:
# - `release: published` — the fork's dsh-v* release, built and attached.
# - `push` of a `dsh-v*` tag — the release workflow that created the release
#   sometimes publishes it before these artifacts exist, so a tag push is an
#   independent trigger rather than a second manual step.
# - `workflow_dispatch` — rebuild and attach to an existing release by tag, which
#   is how a release created earlier gains its desktop packages.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the installers to (for example dsh-v0.2.1-rc.3); leave empty to build without attaching'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'dsh-v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            installers: |
              apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
              apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          - target: win-x64
            runner: windows-latest
            installers: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          - target: mac-arm64
            runner: macos-15
            installers: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          - target: mac-x64
            runner: macos-15-intel
            installers: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    permissions:
      contents: write
      # Keyless signing: the attestation is signed with this workflow's OIDC
      # identity and recorded in the repository's attestation store, so no
      # certificate is bought and no signing key is stored anywhere.
      id-token: write
      attestations: write
    env:
      DSH_TELEMETRY_DISABLED: '1'
      TMPDIR: ${{ github.workspace }}/tmp
      # One tag resolution for every trigger: the release event names it, a tag
      # push carries it, and a manual run may name it to attach to that release.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (github.event_name == 'push' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p tmp
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        if: env.RELEASE_TAG != ''
        run: node --input-type=module -e "import fs from 'node:fs'; const {version}=JSON.parse(fs.readFileSync('package.json','utf8')); if(process.env.RELEASE_TAG !== 'dsh-v'+version) throw Error('Release tag must match dsh-v'+version+', got '+process.env.RELEASE_TAG)"
      - name: Build desktop installers
        run: pnpm --dir apps/desktop exec tsx scripts/package-target.ts "${{ matrix.target }}" --unsigned
      - name: Checksum installers
        env:
          # The name carries the target because every target's checksum file is
          # attached to the same release, where basenames must be unique.
          CHECKSUMS_NAME: SHA256SUMS-${{ matrix.target }}
        working-directory: apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts
        run: |
          node --input-type=module -e "
          import { createHash } from 'node:crypto'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs'
          const names = readdirSync('.').filter(name => /\\.(?:deb|AppImage|exe|dmg)$/u.test(name)).sort()
          if (names.length === 0) throw new Error('no installer in ' + process.cwd())
          const lines = names.map(name => createHash('sha256').update(readFileSync(name)).digest('hex') + '  ' + name)
          writeFileSync(process.env.CHECKSUMS_NAME, lines.join('\\n') + '\\n')
          console.log(lines.join('\\n'))
          "
      - name: Retain installers
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ matrix.installers }}
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
      - name: Sign installers
        uses: actions/attest-build-provenance@v4.2.2
        with:
          # One subject per installer, read from the digests the previous step
          # computed, so every published file carries its own provenance.
          subject-checksums: apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/SHA256SUMS-${{ matrix.target }}
      - name: Attach installers to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          found=(apps/desktop/.desktop-build/targets/"${{ matrix.target }}"/unsigned-artifacts/*.{deb,AppImage,exe,dmg})
          # The matrix entry already names what this target must produce, so an
          # empty sweep means the packaging step lied, not that the release has
          # nothing to attach.
          test "${#found[@]}" -gt 0 || { echo "no installer for ${{ matrix.target }}"; exit 1; }
          gh release upload "$RELEASE_TAG" "${found[@]}" --clobber
          gh release upload "$RELEASE_TAG" apps/desktop/.desktop-build/targets/"${{ matrix.target }}"/unsigned-artifacts/SHA256SUMS-${{ matrix.target }} --clobber
