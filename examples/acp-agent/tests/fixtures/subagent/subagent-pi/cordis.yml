# Test-only composition of the public opt-in provider and foreground tool.
# The owning e2e boots this tree but never invokes the model or Pi.
- id: fixture
  name: './fixture.ts'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: subagent-pi
  name: '@deepseek-ai/dsh-subagent-pi'

- id: tool-subagent-pi
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: pi
    toolName: subagent_pi
    enableRunInBackground: false
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'This composition test must not start a model turn.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
