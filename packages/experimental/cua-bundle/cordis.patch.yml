- insert:
    - id: cua-provider-registry
      name: '@deepseek-ai/dsh-computer-use'
    - id: cua-macos
      name: '@deepseek-ai/dsh-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        agentPreset: ptc
    - id: cua-windows
      name: '@deepseek-ai/dsh-cua-windows'
      disabled: !!js process.platform !== 'win32'
      config:
        agentPreset: ptc
    # Linux runs the Cua Driver SDK inside this process instead of the macOS and
    # Windows helper applications, so it needs a graphical X11 session but no
    # separate permission surface.
    - id: cua-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
      disabled: !!js process.platform !== 'linux'
    - id: ui-cua
      name: '@deepseek-ai/dsh-cua'
      # The permission page drives the shared `cuaAccess` Service, which only the
      # macOS and Windows native channels provide; Linux keeps the provider tools
      # and loads no client UI.
      disabled: !!js process.platform !== 'darwin' && process.platform !== 'win32'